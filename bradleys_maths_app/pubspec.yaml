name: bradleys_maths_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  sqflite_common_ffi_web: ^0.4.0
  sqlite3_flutter_libs: ^0.5.20
  path: ^1.8.3
  flutter_math_fork: ^0.7.2
  google_fonts: ^6.1.0
  flutter_widget_from_html_core: ^0.10.0
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  in_app_purchase: ^3.2.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0F172A"
  image: "assets/icon/app_icon.png"
  android_12:
    color: "#0F172A"
    image: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/bradleys_maths.db
    - assets/questions.json
    - assets/icon/app_icon.png
    - assets/images/Pure_SVGs/
    - assets/images/Mechanics_SVGs/
    - assets/images/Statistics_SVGs/
    - assets/images/Mechanics_PNGs/
    - assets/images/Pure_PNGs/
    - assets/images/Statistics_PNGs/